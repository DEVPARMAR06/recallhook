[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recallhook"
version = "0.1.1"
description = "Private, local long-term memory for Claude Code (desktop app, VS Code, terminal): a hook that recalls and stores facts with mem0 + Ollama."
keywords = ["claude-code", "claude", "memory", "mem0", "ollama", "hooks", "local-first", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
readme = "README.md"
authors = [{ name = "DEVPARMAR06" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mem0ai>=2.2", "ollama", "qdrant-client", "fastapi", "uvicorn", "httpx"]

[project.urls]
Homepage = "https://github.com/DEVPARMAR06/recallhook"
Repository = "https://github.com/DEVPARMAR06/recallhook"
Issues = "https://github.com/DEVPARMAR06/recallhook/issues"

[project.optional-dependencies]
headroom = ["headroom-ai[proxy]"]
dev = ["pytest", "anyio"]

[project.scripts]
recallhook = "recallhook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recallhook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "bench", "scripts", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
